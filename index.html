<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AMAN MEDICAL AGENCY — Temporarily Unavailable</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1B2B23;
    --ink-soft:#4B5A50;
    --paper:#F7F5EF;
    --panel:#FFFFFF;
    --hairline:#DDD6C8;
    --green:#2F6F4E;
    --green-deep:#1F4E37;
    --amber:#B5652B;
    --amber-soft:#F3E4D4;
    --red:#B23B3B;
    --shadow: 0 1px 2px rgba(27,43,35,0.06), 0 8px 24px -12px rgba(27,43,35,0.18);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'Inter',sans-serif;
    -webkit-font-smoothing:antialiased;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .card{
    background:var(--panel);
    border:1px solid var(--hairline);
    border-radius:12px;
    padding:28px;
    max-width:820px;
    box-shadow:var(--shadow);
    text-align:center;
  }
  .card h1{ font-family:'Fraunces', serif; margin:0 0 8px; font-size:26px; }
  .card p{ margin:6px 0; color:var(--ink-soft); }
  .contact{ margin-top:12px; font-weight:600; color:var(--green-deep); }
</style>
</head>
<body>
  <div class="card">
    <h1>Server is under maintenance</h1>
    <p>This website is temporarily unavailable.</p>
    <p>Please contact the website provider for more detail.</p>
    <p class="contact">Contact: Website Provider</p>
  </div>
</body>
</html>
